
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - BookZen</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/theme.css') }}">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .login-box {
            width: 380px;
            padding: 35px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            color: var(--gold);
            margin-bottom: 10px;
        }

        p {
            color: var(--muted);
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
        }

        button[type="submit"] {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: var(--muted);
            text-decoration: none;
        }

        .theme-toggle {
            margin-top: 18px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>🛡️ BookZen Admin</h1>

        <p>
            Administrator Login
        </p>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Admin Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                🔐 Login as Admin
            </button>

        </form>

        <a
            class="back"
            href="{{ url_for('home') }}">
            ← Back to BookZen
        </a>

        <button
            id="themeToggle"
            class="theme-toggle">
            ☀️ Light
        </button>

    </div>

    <script src="{{ url_for(
        'static',
        filename='js/theme.js'
    ) }}"></script>

</body>

</html>
