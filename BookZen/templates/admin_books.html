
<!DOCTYPE html>
<html>

<head>

    <title>Manage Books - BookZen</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/theme.css') }}">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .navbar {
            padding: 18px 35px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .logo {
            color: var(--gold);
            font-size: 25px;
            font-weight: bold;
        }

        .navbar a {
            color: var(--text);
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            max-width: 1250px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .add {
            background: var(--primary);
            color: white;
            padding: 12px 17px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .table-box {
            overflow-x: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        th {
            color: var(--gold);
        }

        .edit {
            background: var(--primary);
            color: white;
            padding: 7px 10px;
            border-radius: 7px;
            text-decoration: none;
        }

        .delete {
            background: #8b2d45;
            color: white;
            padding: 7px 10px;
            border-radius: 7px;
            text-decoration: none;
            margin-left: 5px;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            📚 BookZen Admin
        </div>

        <div>

            <a href="{{ url_for('admin_dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('admin_logout') }}">
                Logout
            </a>

            <button id="themeToggle"
                    class="theme-toggle">
                ☀️ Light
            </button>

        </div>

    </div>


    <div class="container">

        <div class="top">

            <h1>
                📚 Manage Books
            </h1>

            <a class="add"
               href="{{ url_for('admin_book_add') }}">
                ➕ Add Book
            </a>

        </div>


        <div class="table-box">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Title</th>

                        <th>Author</th>

                        <th>Genre</th>

                        <th>Rating</th>

                        <th>Year</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody>

                    {% for book in books %}

                    <tr>

                        <td>
                            {{ book.book_id }}
                        </td>

                        <td>
                            {{ book.title }}
                        </td>

                        <td>
                            {{ book.author }}
                        </td>

                        <td>
                            {{ book.genre }}
                        </td>

                        <td>
                            ⭐ {{ book.rating }}
                        </td>

                        <td>
                            {{ book.year }}
                        </td>

                        <td>

                            <a
                                class="edit"
                                href="{{ url_for(
                                    'admin_edit_book',
                                    book_id=book.book_id
                                ) }}">
                                ✏️ Edit
                            </a>

                            <a
                                class="delete"
                                href="{{ url_for(
                                    'admin_delete_book',
                                    book_id=book.book_id
                                ) }}"
                                onclick="return confirm(
                                    'Are you sure you want to delete this book?'
                                );">
                                🗑️ Delete
                            </a>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>


    <script src="{{ url_for(
        'static',
        filename='js/theme.js'
    ) }}"></script>

</body>

</html>
